# Copy this to  ~/.config/himalaya/config.toml  and fill in your details.
# The password below is a Gmail APP PASSWORD (16 chars), NOT your Google
# password. Create one at https://myaccount.google.com/apppasswords
# (requires 2-Step Verification enabled on the account).

[accounts.gmail]
imap.server = "imaps://imap.gmail.com:993"
imap.sasl.plain.username = "you@gmail.com"
imap.sasl.plain.password.raw = "your-16-char-app-password"

smtp.server = "smtps://smtp.gmail.com:465"
smtp.sasl.plain.username = "you@gmail.com"
smtp.sasl.plain.password.raw = "your-16-char-app-password"

mailbox.alias.inbox  = "INBOX"
mailbox.alias.drafts = "[Gmail]/Drafts"
mailbox.alias.sent   = "[Gmail]/Sent Mail"
